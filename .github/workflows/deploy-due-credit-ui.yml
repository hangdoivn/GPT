name: Deploy DUE Credit UI

on:
  push:
    branches:
      - "claude/fanpage-ad-management-aiihk8"
    paths:
      - "due-credit-ui/**"
      - ".github/workflows/deploy-due-credit-ui.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: due-credit-ui
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
